<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krrish Majhi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Profile Card Container -->
    <div class="profile-card">
      <!-- Profile Image Section -->
      <div class="image">
        <img src="photo.jpg" alt="krrish" class="profile-img" />
      </div>

      <!-- Text Data Section (Name and Job) -->
      <div class="text-data">
        <span class="name">Krrish Majhi </span>
        <span class="job">
          Full stack web developer <br />
          (jhooth h ye sab, kuch nahi aata is gadhe ko)
        </span>
      </div>

      <!-- Social Media Buttons Section -->
      <div class="media-button">
        <a href="#" class="link">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="#" class="link">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" class="link">
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="#" class="link">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="#" class="link">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>

      <!-- Navigation Buttons Section -->
      <div class="buttons">
        <div class="button">Education</div>
        <div class="button">Skill</div>
        <div class="button">Contact</div>
      </div>
    </div>
  </body>
</html>
